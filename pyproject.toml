[build-system]
requires = [
    "setuptools>=75",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"


[project]
name = "psynthea-validation"
version = "0.1.0"
description = "Scientific validation framework for comparing synthetic clinical cohorts generated by psynthea and Synthea."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.14,<2.0",
]


[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6,<8.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=6.0,<8.0",
]


[project.scripts]
psynthea-validation = "validation.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false


[tool.setuptools.packages.find]
where = ["src"]
include = ["validation*"]
exclude = ["validation.tests*"]


[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["src/validation/tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=validation",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-ra",
]


[tool.coverage.run]
branch = true
source = ["validation"]
omit = [
    "src/validation/tests/*",
]


[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]


[tool.coverage.xml]
output = "coverage.xml"
